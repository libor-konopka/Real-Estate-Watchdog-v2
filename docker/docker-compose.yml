name: real-estate-watchdog

services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Webové rozhraní
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: amazon/aws-cli:latest
    container_name: lakehouse-minio-init
    depends_on:
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh -c
    command: >
      "sleep 5 && aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || true"

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
      - NESSIE_CATALOG_DEFAULT_WAREHOUSE=default
      - NESSIE_CATALOG_WAREHOUSES_DEFAULT_LOCATION=s3://warehouse
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT=http://minio:9000
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY=admin
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_SECRET_KEY=password
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION=us-east-1
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS=true
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE=STATIC
volumes:
  minio_data: