name: real-estate-watchdog-v2

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lakehouse-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Web Console
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  minio-init:
    image: amazon/aws-cli:2.27.0
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh -c
    command: >
      "aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || true"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.103.3
    container_name: lakehouse-nessie
    user: "0:0" # Ensures write permissions for RocksDB inside the named volume
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
      - nessie.version.store.type=ROCKSDB
      - nessie.version.store.persist.rocks.db-path=/nessie/data
      - nessie.catalog.default-warehouse=default
      - nessie.catalog.warehouses.default.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.auth-type=STATIC
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=admin
      - nessie.catalog.secrets.access-key.secret=password
    volumes:
      - nessie_data:/nessie/data

volumes:
  minio_data:
  nessie_data:
